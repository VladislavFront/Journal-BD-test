<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../../css/normalize.css">

  <link rel="stylesheet" href="../../css/main.css">
  <!-- <link rel="stylesheet" href="../../css/student.css"> -->
  <link rel="stylesheet" href="../../css/journal.css">

  <link rel="stylesheet" href="../../css/adaptive/main-adaptive.css">
  <!-- <link rel="stylesheet" href="../../css/adaptive/student-adaptive.css"> -->
  <link rel="stylesheet" href="../../css/adaptive/journal-adaptive.css">

  <title>Электронный журнал 40 || Дневник Учителя</title>
</head>
<body>

  <div class="burger">
    <div class="burger__wrapper">
      <div class="burger__top">
        <div class="burger__help-container">
          <div class="logo-container logo-container_burger">
            <div class="logo-container__img"></div>
            <div class="logo-text">
              <div class="logo-text__title">Дневник</div>
              <p class="logo-text__sub-title">Электронный журнал</p>
            </div>
          </div>
          <div class="burger__top-container">
            <div class="user-block">
              <div class="user-block__avatar js-teacher-avatar"></div>
              <div class="user-info">
                <div class="user-info__name js-teacher-name"></div>
                <p class="user-info__class js-teacher-subject"></p>
                <!-- <p class="user-info__class">9A класс</p> -->
              </div>
            </div>
            <button class="header-right__btn-exit">Выйти</button>
          </div>
        </div>
        <div class="burger__closed-btn" onclick="closedBurgerMenu()"></div>
      </div>
      <div class="burger__main">
        <nav class="aside-nav">
          <ul class="aside-nav__nav-list">
            <li class="aside-nav__list-item"><a href="journal.html" class="aside-nav__link"><img src="../../assets/diary.svg" alt="Дневник" class="aside-nav__link-logo">Журнал класса</a></li>
            <li class="aside-nav__list-item"><a href="schedule-week.html" class="aside-nav__link"><img src="../../assets/schedule.svg" alt="Расписание" class="aside-nav__link-logo">Расписание на неделю</a></li>
            <li class="aside-nav__list-item"><a href="homework.html" class="aside-nav__link"><img src="../../assets/homework.svg" alt="Оценки" class="aside-nav__link-logo">Выставление ДЗ</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </div>

  <header class="header">
    <div class="main-wrapper">
      <div class="header-left">
      <div class="logo-container">
        <div class="logo-container__img"></div>
        <!-- <img src="#" alt="Логотип школы номер 40" class="logo-container__img"> -->
        <div class="logo-text">
          <div class="logo-text__title">Дневник</div>
          <p class="logo-text__sub-title">Электронный журнал</p>
        </div>
      </div>

      <div class="header-search">
        <input type="search" class="header-search__input" placeholder="Поиск по дневнику">
      </div>
      </div>

      <div class="header-right">
        <button class="header-right__btn-exit">Выйти</button>
        <div class="user-block">
          <div class="user-block__avatar js-teacher-avatar"></div>
          <div class="user-info">
            <div class="user-info__name js-teacher-name"></div>
            <p class="user-info__class js-teacher-subject"></p>
          </div>
        </div>
        <div class="burger-button" onclick="openBurgerMenu()">
          <span class="burger-button__span"></span>
        </div>
      </div>
    </div>
  </header>

  <main class="main">

    <div class="main-content">
      <aside class="left-panel sidebar">
        <div class="aside-card aside-card_one">
          <div class="user-block">
            <div class="user-block__avatar js-teacher-avatar"></div>
            <div class="user-info">
              <div class="user-info__name js-teacher-name"></div>
              <p class="user-info__class user-class-teacher__sub-title js-teacher-subject"></p>
            </div>
          </div>
          <div class="user-class-teacher">
            <div class="user-class-teacher__title">Кл. руководитель</div>
            <div class="user-class-teacher_sub-title js-teacher-lead"></div>
          </div>
        </div>

        <div class="aside-card aside-card_nav">
          <nav class="aside-nav">
            <ul class="aside-nav__nav-list">
              <li class="aside-nav__list-item"><a href="journal.html" class="aside-nav__link"><img src="../../assets/diary.svg" alt="Дневник" class="aside-nav__link-logo">Журнал класса</a></li>
              <li class="aside-nav__list-item"><a href="schedule-week.html" class="aside-nav__link"><img src="../../assets/schedule.svg" alt="Расписание" class="aside-nav__link-logo">Расписание на неделю</a></li>
              <li class="aside-nav__list-item"><a href="homework.html" class="aside-nav__link"><img src="../../assets/homework.svg" alt="Оценки" class="aside-nav__link-logo">Выставление ДЗ</a></li>
            </ul>
          </nav>
        </div>
      </aside>

      <div class="center-panel">
        <div class="work-block">
          <h1 class="work-block__title">Домашние задания</h1>
          <div class="work-block__select-container">
            <input type="date" class="input-date-custom js-hw-date"  id="date-input" value="">
            <select class="select-custom select-hw js-hw-subject" id="subject-select">
              <option value="Алгебра">Алгебра</option>
              <option value="Биология">Биология</option>
              <option value="Вероятность и статистика">Вероятность и статистика</option>
              <option value="География">География</option>
              <option value="Геометрия">Геометрия</option>
              <option value="Изобразительное искусство">Изобразительное искусство</option>
              <option value="Иностранный язык">Иностранный язык</option>
              <option value="Информатика">Информатика</option>
              <option value="История">История</option>
              <option value="Литература">Литература</option>
              <option value="Музыка">Музыка</option>
              <option value="Обществознание">Обществознание</option>
              <option value="Основы безопасности и защиты Родины (ОБЗР)">Основы безопасности и защиты Родины (ОБЗР)</option>
              <option value="Русский язык">Русский язык</option>
              <option value="Труд (технология)">Труд (технология)</option>
              <option value="Физика">Физика</option>
              <option value="Физическая культура">Физическая культура</option>
              <option value="Химия">Химия</option>
            </select>
            <select class="select-custom js-hw-class" id="class-select">
              <!-- 1 классы -->
              <option value="1">1 «А» класс</option>
              <option value="2">1 «Б» класс</option>
              <option value="3">1 «В» класс</option>
              <option value="4">1 «Г» класс</option>

              <!-- 2 классы -->
              <option value="5">2 «А» класс</option>
              <option value="6">2 «Б» класс</option>
              <option value="7">2 «В» класс</option>
              <option value="8">2 «Г» класс</option>

              <!-- 3 классы -->
              <option value="9">3 «А» класс</option>
              <option value="10">3 «Б» класс</option>
              <option value="11">3 «В» класс</option>
              <option value="12">3 «Г» класс</option>

              <!-- 4 классы -->
              <option value="13">4 «А» класс</option>
              <option value="14">4 «Б» класс</option>
              <option value="15">4 «В» класс</option>
              <option value="16">4 «Г» класс</option>

              <!-- 5 классы -->
              <option value="17">5 «А» класс</option>
              <option value="18">5 «Б» класс</option>
              <option value="19">5 «В» класс</option>
              <option value="20">5 «Г» класс</option>

              <!-- 6 классы -->
              <option value="21">6 «А» класс</option>
              <option value="22">6 «Б» класс</option>
              <option value="23">6 «В» класс</option>
              <option value="24">6 «Г» класс</option>

              <!-- 7 классы -->
              <option value="25">7 «А» класс</option>
              <option value="26">7 «Б» класс</option>
              <option value="27">7 «В» класс</option>
              <option value="28">7 «Г» класс</option>

              <!-- 8 классы -->
              <option value="29">8 «А» класс</option>
              <option value="30">8 «Б» класс</option>
              <option value="31">8 «В» класс</option>
              <option value="32">8 «Г» класс</option>

              <!-- 9 классы -->
              <option value="33">9 «А» класс</option>
              <option value="34">9 «Б» класс</option>
              <option value="35">9 «В» класс</option>
              <option value="36">9 «Г» класс</option>

              <!-- 10 классы -->
              <option value="37">10 «А» класс</option>
              <option value="38">10 «Б» класс</option>
              <option value="39">10 «В» класс</option>
              <option value="40">10 «Г» класс</option>

              <!-- 11 классы -->
              <option value="41">11 «А» класс</option>
              <option value="42">11 «Б» класс</option>
              <option value="43">11 «В» класс</option>
              <option value="44">11 «Г» класс</option>
            </select>
            <button class="select-submit js-hw-save">Сохранить выставленное ДЗ</button>
          </div>
        </div>

        <div class="grading-grid">
          <div class="form-group">
            <label>Что задано на выбранную дату:</label>
            <textarea class="textarea-custom js-hw-text" id="homework-text" placeholder="Введите текст задания... Параграф 12, упр. 3, 4 (выполнить в тетради)"></textarea>
          </div>
          <div class="form-group">
            <label>Прикрепить ссылку на материалы (необязательно):</label>
            <input type="text" class="input-comment js-hw-link" id="homework-link" placeholder="https://...">
          </div>
        </div>
      </div>
    </div>
  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/database-config.js"></script>

  <script src="../../js/main.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/mark.js/8.11.1/mark.min.js"></script>

  <script src="../../js/search.js"></script>
  <script src="../../js/teacher-ui.js"></script>
  <script src="../../js/homework.js"></script>
</body>
</html>
